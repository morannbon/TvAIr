name: TvAIr Build Test

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    strategy:
      matrix:
        platform:
          - x64
          - x86

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build TvAIr
        run: msbuild TvAIr.sln /restore /m /p:Configuration=Release /p:Platform=${{ matrix.platform }}

      - name: Upload build result
        uses: actions/upload-artifact@v4
        with:
          name: TvAIr-Release-${{ matrix.platform }}
          path: |
            TvAIr/bin/${{ matrix.platform }}/Release/**
            TvAIrEpgRec/bin/${{ matrix.platform }}/Release/**
            TvAIrPlugin/bin/${{ matrix.platform }}/Release/**
            AribDecodeBridge/bin/Release/${{ matrix.platform }}/**
          if-no-files-found: error
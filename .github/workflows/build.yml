name: TvAIr Build Test

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    strategy:
      matrix:
        platform:
          - x64
          - x86

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build TvAIr
        run: msbuild TvAIr.sln /restore /m /p:Configuration=Release /p:Platform=${{ matrix.platform }}

      - name: Prepare user package
        shell: pwsh
        run: |
          $out = "package\${{ matrix.platform }}"
          $source = "TvAIr\bin\${{ matrix.platform }}\Release\net8.0-windows"

          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item "$source\*" $out -Recurse -Force

          Copy-Item "README.md" $out
          Copy-Item "README.txt" $out
          Copy-Item "LICENSE" $out
          Copy-Item "Regex_Manual.txt" $out

          Get-ChildItem $out -Recurse -Include *.pdb,*.lib,*.exp |
            Remove-Item -Force

          $runtimeRoot = Join-Path $out "runtimes"
          if (Test-Path $runtimeRoot) {
            $keep = "win-${{ matrix.platform }}"
            Get-ChildItem $runtimeRoot -Directory |
              Where-Object { $_.Name -ne $keep -and $_.Name -ne "win" } |
              Remove-Item -Recurse -Force
          }

      - name: Upload user package
        uses: actions/upload-artifact@v4
        with:
          name: TvAIr-${{ matrix.platform }}-ready
          path: package/${{ matrix.platform }}/
          if-no-files-found: error
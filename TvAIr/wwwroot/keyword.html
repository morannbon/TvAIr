<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1" name="viewport"/>
<title>キーワード検索 — TvAIr</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico?v=1.2.0"/>
<link rel="shortcut icon" type="image/x-icon" href="/favicon.ico?v=1.2.0"/>

<link href="/tvair-ui-foundation.css?v=1.2.0" rel="stylesheet"/>
<link href="/tvair-theme-contract.css?v=1.2.0-theme206" rel="stylesheet"/>
<link href="/tvair-ui-modules.css?v=1.2.0-modules251" rel="stylesheet"/>
<link href="/tvair-list-module.css?v=1.2.0-list206" rel="stylesheet"/>
<link href="/tvair-keyword.css?v=1.2.0-owner203" rel="stylesheet"/>
<link href="/tvair-notification.css?v=1.2.0-owner203" rel="stylesheet"/>
<link href="/tvair-settings-host.css?v=1.2.0" rel="stylesheet"/>

<script src="/tvair-theme.js?v=1.2.0"></script>
<script src="/tvair-action-button-state.js?v=1.2.0"></script>

</head>
<body class="tvair-non-program-page tvair-keyword-page tvair-split-page">
<div class="tvair-topnav" id="nav">
<a class="nav-btn" href="/">番組表</a>
<a class="nav-btn" href="/reservations.html">予約リスト</a>
<a class="nav-btn active" href="/keyword.html">キーワード検索</a>
<a class="nav-btn" href="/program-rules.html">自動検索予約</a>
<a class="nav-btn" href="/new-reservation.html">プログラム予約</a>
<div class="spacer"></div>
<span class="nav-brand-text">TvAIr</span>
<div id="page-menu-wrap">
<button aria-label="メニュー" id="page-menu-btn" data-tvair-menu-entry="page" aria-controls="page-menu-dropdown" type="button">☰</button>
<div data-tvair-menu-host="1" id="page-menu-dropdown"></div>
</div>
</div>
<div id="body">
<!-- 検索フォーム -->
<div id="form-panel">
<div class="form-section">
<div class="form-section-title">キーワード</div>
<div class="form-row">
<label>タイトルキーワード</label>
<input id="kw-title" type="text"/>
</div>
<div class="form-row">
<label>詳細キーワード</label>
<input id="kw-desc" type="text"/>
</div>
<div class="opt-row tvair-choice-row">
<label class="opt-label"><input id="opt-desc-search" type="checkbox"/> 説明文も検索</label>
<label class="opt-label"><input checked="" id="opt-fuzzy" type="checkbox"/> あいまい検索</label>
</div>
</div>
<div class="form-section">
<div class="form-section-title">時間指定</div>
<div class="time-row tvair-time-row">
<select id="time-from"><option value="">指定なし</option></select>
<span>時 〜</span>
<select id="time-to"><option value="">指定なし</option></select>
<span>時</span>
</div>
</div>
<div class="form-section">
<div class="form-section-title">曜日指定</div>
<div class="dow-row tvair-choice-row tvair-weekday-row" id="dow-row"></div>
</div>
<div class="form-section">
<div class="form-section-title">チャンネル（複数選択可）</div>
<div class="ch-list" id="ch-list"></div>
<div class="mt4 ui-row-gap4">
<button class="kw-channel-bulk-btn" onclick="selAllCh()">全選択</button>
<button class="kw-channel-bulk-btn" onclick="selNoneCh()">全解除</button>
</div>
</div>
<div class="form-section">
<div class="form-section-title">期間</div>
<div class="date-row">
<input id="date-from" type="date"/>
<span>〜</span>
<input id="date-to" type="date"/>
</div>
</div>
<button id="search-btn" onclick="doSearch()">🔍 検索</button>
</div>
<!-- 検索結果 -->
<div id="result-panel">
<div class="initial-hidden" id="result-summary">
<span id="result-count">0</span> 件見つかりました
    </div>
<div class="initial-hidden" id="result-wrap">
<table id="result-table">
<thead>
<tr>
<th>日時</th>
<th>チャンネル</th>
<th>タイトル / 説明</th>
<th>時間</th>
<th>予約</th>
</tr>
</thead>
<tbody id="result-body"></tbody>
</table>
<div id="result-empty">検索結果がありません</div>
</div>
<div id="result-init">キーワードを入力して検索してください</div>
</div>
</div>
<div id="toast"></div>
<script>
const DOW_LABELS=['日','月','火','水','木','金','土'];
let channels=[];
let selectedCh=new Set();
let reservedByKey=new Map();
let lastSearchEvents=[];
let lastSearchTotal=0;
let keywordDeepLinkApplied=false;

function p2(n){return String(n).padStart(2,'0')}
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function fmtDate(s){
  const d=new Date(s);
  return `${d.getFullYear()}/${p2(d.getMonth()+1)}/${p2(d.getDate())}（${DOW_LABELS[d.getDay()]}）`;
}
function fmtTime(s,e){
  const ds=new Date(s),de=new Date(e);
  return `${p2(ds.getHours())}:${p2(ds.getMinutes())}～${p2(de.getHours())}:${p2(de.getMinutes())}`;
}
function fmtDur(sec){
  const m=Math.round(sec/60);
  return m>=60?`${Math.floor(m/60)}時間${m%60?m%60+'分':''}`:`${m}分`;
}
function evKey(e){return `${e.networkId}:${e.transportStreamId}:${e.serviceId}:${e.eventId}`;}

function initTimeSelects(){
  ['time-from','time-to'].forEach(id=>{
    const sel=document.getElementById(id);
    for(let h=0;h<24;h++){
      const opt=document.createElement('option');
      opt.value=String(h);opt.textContent=`${p2(h)}:00`;
      sel.appendChild(opt);
    }
  });
}

function syncChoiceChipLabel(label){
  if(!label) return;
  const input=label.querySelector('input[type=checkbox]');
  label.classList.toggle('checked', !!(input && input.checked));
  label.setAttribute('aria-pressed', input && input.checked ? 'true' : 'false');
}
function initDow(){
  const row=document.getElementById('dow-row');
  DOW_LABELS.forEach((d,i)=>{
    const lbl=document.createElement('label');
    lbl.className='dow-label tvair-check-chip tvair-weekday-chip';
    lbl.innerHTML=`<input type="checkbox" value="${i}" checked> <span>${d}</span>`;
    const input=lbl.querySelector('input');
    input.addEventListener('change',()=>syncChoiceChipLabel(lbl));
    syncChoiceChipLabel(lbl);
    row.appendChild(lbl);
  });
}

async function loadChannels(){
  try{
    const res=await fetch('/api/channels');
    const d=await res.json();
    channels=d.channels||[];
    const list=document.getElementById('ch-list');
    list.innerHTML='';
    channels.forEach(ch=>{
      const key=`${ch.networkId}:${ch.transportStreamId}:${ch.serviceId}`;
      selectedCh.add(key);
      const div=document.createElement('div');
      div.className='ch-item selected';
      div.dataset.serviceKey=key;
      div.textContent=ch.name;
      div.onclick=()=>toggleCh(div,key);
      list.appendChild(div);
    });
    applyProgramGuideTitleKeywordDeepLink();
  }catch(e){console.error(e);}
}

function toggleCh(el,key){
  if(selectedCh.has(key)){selectedCh.delete(key);el.classList.remove('selected');}
  else{selectedCh.add(key);el.classList.add('selected');}
}
function selAllCh(){
  document.querySelectorAll('.ch-item').forEach(el=>{selectedCh.add(el.dataset.serviceKey);el.classList.add('selected');});
}
function selNoneCh(){
  selectedCh.clear();
  document.querySelectorAll('.ch-item').forEach(el=>el.classList.remove('selected'));
}

function applyProgramGuideTitleKeywordDeepLink(){
  // release_contract ProgramGuideTitleKeywordRouteContract:
  // title clicks from the program guide land here with q + event identity.
  // Scope the channel only when the source is explicitly the program guide title;
  // ordinary keyword searches keep the user's current channel selection behavior.
  if(keywordDeepLinkApplied) return;
  const params=new URLSearchParams(location.search||'');
  const q=params.get('q') || params.get('title') || '';
  if(q) document.getElementById('kw-title').value=q;
  const source=(params.get('source')||'').toLowerCase();
  const nid=params.get('nid') || params.get('networkId') || '';
  const tsid=params.get('tsid') || params.get('transportStreamId') || '';
  const sid=params.get('sid') || params.get('serviceId') || '';
  if(source==='programguidetitle' && nid && tsid && sid){
    const serviceKey=`${nid}:${tsid}:${sid}`;
    selectedCh.clear();
    document.querySelectorAll('.ch-item').forEach(el=>{
      const hit=String(el.dataset.serviceKey||'')===serviceKey;
      el.classList.toggle('selected', hit);
      if(hit) selectedCh.add(serviceKey);
    });
  }
  keywordDeepLinkApplied=true;
  if(q) setTimeout(doSearch,0);
}

async function loadReserved(){
  try{
    const res=await fetch('/api/reservations');
    const rsvs=await res.json();
    reservedByKey=new Map((rsvs||[])
      .filter(r=>['scheduled','starting','recording','stopping'].includes(String(r.status||'').toLowerCase()))
      .map(r=>[`${r.networkId}:${r.transportStreamId}:${r.serviceId}:${r.eventId}`,r]));
  }catch(e){}
}

async function doSearch(){
  await loadReserved();
  const params=new URLSearchParams();
  const title=document.getElementById('kw-title').value.trim();
  const desc=document.getElementById('kw-desc').value.trim();
  const kw=[title,desc].filter(Boolean).join(' ');
  if(kw) params.set('q',kw);
  if(document.getElementById('opt-desc-search').checked) params.set('desc','true');
  if(selectedCh.size>0 && selectedCh.size<channels.length)
    params.set('services',[...selectedCh].join(','));
  const checkedDow=[...document.querySelectorAll('#dow-row input:checked')].map(i=>i.value);
  if(checkedDow.length<7 && checkedDow.length>0)
    params.set('dow',checkedDow.join(','));
  const tf=document.getElementById('time-from').value;
  const tt=document.getElementById('time-to').value;
  if(tf) params.set('timeFrom',tf);
  if(tt) params.set('timeTo',tt);
  const df=document.getElementById('date-from').value;
  const dt=document.getElementById('date-to').value;
  if(df) params.set('dateFrom',df);
  if(dt) params.set('dateTo',dt);

  const btn=document.getElementById('search-btn');
  const buttonState=window.TvAirActionButtonState.begin(btn);
  try{
    const res=await fetch('/api/epg/search?'+params.toString());
    const d=await res.json();
    lastSearchEvents=d.events||[]; lastSearchTotal=d.count||0;
    renderResults(lastSearchEvents,lastSearchTotal);
  }catch(e){showToast('検索エラー: '+e.message);}
  finally{window.TvAirActionButtonState.finish(btn,buttonState,'🔍 検索');}
}

function renderResults(events,total){
  document.getElementById('result-init').style.display='none';
  document.getElementById('result-summary').style.display='block';
  document.getElementById('result-wrap').style.display='block';
  document.getElementById('result-count').textContent=total;
  const tbody=document.getElementById('result-body');
  const empty=document.getElementById('result-empty');
  if(events.length===0){tbody.innerHTML='';empty.style.display='block';return;}
  empty.style.display='none';
  tbody.innerHTML=events.map(e=>{
    const key=evKey(e);
    const reservation=reservedByKey.get(key)||null;
    const status=String(reservation?.status||'').toLowerCase();
    const timeAction=window.TvAirProgramTimeAction.resolve(e, 'keywordsearch');
    let btnHtml='';
    if(reservation){
      if(status==='recording'){
        btnHtml=`<button class="rsv-btn tvair-action-button program-cell-action-btn program-cell-action-btn--list-context" data-program-action="stop" data-action-context="keyword-search-result-row" onclick="stopKeywordReservation(${Number(reservation.id)||0},this)">録画停止</button>`;
      }else if(status==='scheduled' && timeAction.action==='reserve'){
        btnHtml=`<button class="rsv-btn tvair-action-button program-cell-action-btn program-cell-action-btn--list-context" data-program-action="cancel" data-action-context="keyword-search-result-row" onclick="cancelKeywordReservation(${Number(reservation.id)||0},this)">予約取消</button>`;
      }else{
        btnHtml=`<button class="rsv-btn tvair-action-button program-cell-action-btn program-cell-action-btn--list-context" disabled aria-busy="true">${window.TvAirActionButtonState.processingText}</button>`;
      }
    }else if(timeAction.action!=='none'){
      btnHtml=`<button class="rsv-btn tvair-action-button program-cell-action-btn program-cell-action-btn--list-context" data-program-action="${timeAction.action}" data-action-role="program-${timeAction.action}" data-action-label="${timeAction.label}" data-action-context="keyword-search-result-row" onclick='reserve(${JSON.stringify(e).replace(/'/g,"&#39;")},this)'>${timeAction.label}</button>`;
    }
    const sub=e.description?`<div class="sub">${esc(e.description)}</div>`:'';
    return `<tr class="${reservation?'reserved':''}">
      <td data-cell-role="date-time-metadata"><div class="td-date">${fmtDate(e.start)}</div><div class="td-time">${fmtTime(e.start,e.end)}</div></td>
      <td class="td-ch" data-cell-role="service-metadata">${esc(e.serviceName||'—')}</td>
      <td class="td-title" data-cell-role="title-data">${esc(e.title)}${sub}</td>
      <td class="td-dur" data-cell-role="duration-metadata">${fmtDur(e.durationSeconds)}</td>
      <td data-cell-role="reservation-action">${btnHtml}</td>
    </tr>`;
  }).join('');
}

async function waitForKeywordReservation(ev, expectedAction, timeoutMs=15000){
  const key=evKey(ev);
  const deadline=Date.now()+timeoutMs;
  while(Date.now()<deadline){
    await loadReserved();
    const r=reservedByKey.get(key)||null;
    const status=String(r?.status||'').toLowerCase();
    if(expectedAction==='reserve' && r && status==='scheduled') return r;
    if(expectedAction==='record-now' && r && status==='recording') return r;
    await new Promise(resolve=>setTimeout(resolve,350));
  }
  await loadReserved();
  return reservedByKey.get(key)||null;
}

async function reserve(ev,btn){
  const timeAction=window.TvAirProgramTimeAction.resolve(ev, 'keywordsearch');
  if(timeAction.action==='none' || btn.dataset.programAction!==timeAction.action){
    btn.remove();
    return;
  }
  const buttonState=window.TvAirActionButtonState.begin(btn);
  try{
    const reservationParams = new URLSearchParams();
    if(ev.projectedEventId || ev.ProjectedEventId) reservationParams.set('projectedEventId', ev.projectedEventId || ev.ProjectedEventId);
    const reservationUrl = '/api/reservations' + (reservationParams.toString() ? '?'+reservationParams.toString() : '');
    const res=await fetch(reservationUrl,{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({networkId:ev.networkId,transportStreamId:ev.transportStreamId,serviceId:ev.serviceId,eventId:ev.eventId,title:ev.title,startTime:ev.start,endTime:ev.end,status:timeAction.status,source:timeAction.source})
    });
    let d={};try{d=await res.json();}catch(_){}
    if(!res.ok){showToast(d.message||'予約に失敗しました。'); return;}
    await waitForKeywordReservation(ev,timeAction.action);
    renderResults(lastSearchEvents,lastSearchTotal);
    showToast('「'+ev.title+'」を予約しました。');
  }catch(e){showToast('通信エラー');}
  finally{
    if(btn && btn.isConnected) window.TvAirActionButtonState.finish(btn,buttonState,timeAction.label);
  }
}

async function cancelKeywordReservation(id,btn){
  if(!id)return;
  const buttonState=window.TvAirActionButtonState.begin(btn);
  try{
    const res=await fetch(`/api/reservations/${id}`,{method:'DELETE'});
    const d=await res.json().catch(()=>({}));
    if(!res.ok){showToast(d.message||'予約取消に失敗しました。'); return;}
    await loadReserved();
    renderResults(lastSearchEvents,lastSearchTotal);
  }catch(e){showToast('通信エラー');}
  finally{if(btn && btn.isConnected) window.TvAirActionButtonState.finish(btn,buttonState,'予約取消');}
}

async function stopKeywordReservation(id,btn){
  if(!id)return;
  const buttonState=window.TvAirActionButtonState.begin(btn);
  try{
    const res=await fetch(`/api/reservations/${id}/stop`,{method:'POST'});
    const d=await res.json().catch(()=>({}));
    if(!res.ok){showToast(d.message||'停止に失敗しました。'); return;}
    const deadline=Date.now()+15000;
    while(Date.now()<deadline){
      await loadReserved();
      const active=[...reservedByKey.values()].some(r=>Number(r.id)===Number(id));
      if(!active) break;
      await new Promise(resolve=>setTimeout(resolve,350));
    }
    await loadReserved();
    renderResults(lastSearchEvents,lastSearchTotal);
  }catch(e){showToast('通信エラー');}
  finally{if(btn && btn.isConnected) window.TvAirActionButtonState.finish(btn,buttonState,'録画停止');}
}


document.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey) doSearch();});

// 初期化
initTimeSelects();
initDow();
loadChannels();

// URLパラメータ ?q= / ?source=programGuideTitle は loadChannels 完了後に
// applyProgramGuideTitleKeywordDeepLink() で処理する。

/* Page menu behavior is owned by tvair-menu-spine.js. */

</script>
<script src="/tvair-notification.js?v=1.2.0"></script>
<script src="/tvair-epg-run-contract.js?v=1.2.0"></script>
<script src="/tvair-settings-host.js?v=1.2.0"></script>
<script src="/tvair-menu-spine.js?v=1.2.0"></script>
</body>

<script>
const STATUS_CLASS = {
  scheduled: 'st-scheduled',
  recording: 'st-recording',
  completed: 'st-completed',
  cancelled: 'st-cancelled',
  failed:    'st-failed'
};

let allData = [];
let reservationById = new Map();
// ReservationUiSingleSourceContract:
// allData is the only UI authority for mutable reservation state. Secondary
// projections (keyword groups, station groups, tagged candidates) may retain
// membership or rule metadata, but must resolve mutable fields by reservation id.
function rebuildReservationUiIndex(){
  reservationById = new Map(allData
    .filter(item => item && Number.isFinite(Number(item.id)))
    .map(item => [Number(item.id), item]));
}
function resolveCanonicalReservation(item){
  if(!item || !Number.isFinite(Number(item.id))) return item;
  return reservationById.get(Number(item.id)) || item;
}
function publishCanonicalReservationSnapshot(nextData){
  allData = Array.isArray(nextData) ? nextData : [];
  rebuildReservationUiIndex();
}
// ReservationActionStateContract:
// Accepted asynchronous actions remain visible until the canonical reservation
// snapshot proves completion. Rendering must not restore the original label between
// request acceptance and completion.
const reservationActionStates=new Map();
function reservationActionKey(id){ return String(id||''); }
function beginReservationActionState(id, action){
  const key=reservationActionKey(id);
  if(!key || reservationActionStates.has(key)) return null;
  // release_contract ReservationActionProcessingLabelContract:
  // Reservation-list buttons use one fixed in-flight label for every action and phase.
  // Action-specific wording can overflow the fixed action slot and must not become UI state.
  const processingText=window.TvAirActionButtonState.processingText;
  const state={key,action:String(action||''),phase:'sending',text:processingText,acceptedText:processingText};
  reservationActionStates.set(key,state);
  return state;
}
function acceptReservationActionState(id){
  const state=reservationActionStates.get(reservationActionKey(id));
  if(!state) return null;
  state.phase='accepted_pending';
  state.text=state.acceptedText;
  render();
  return state;
}
function clearReservationActionState(id){ return reservationActionStates.delete(reservationActionKey(id)); }
function getReservationActionState(id){ return reservationActionStates.get(reservationActionKey(id)) || null; }
function reconcileReservationActionStates(snapshot){
  const byId=new Map((Array.isArray(snapshot)?snapshot:[]).map(item=>[String(item&&item.id||''),item]));
  for(const [key,state] of reservationActionStates){
    const item=byId.get(key);
    const contract=window.TvAirReservationActionState;
    if(!contract) continue;
    if(state.action==='stop' && contract.isStopComplete(item, key)) reservationActionStates.delete(key);
    else if(state.action==='cancel' && contract.isCancelComplete(item, key)) reservationActionStates.delete(key);
    else if(state.action==='enable' && contract.isEnableComplete(item, key)) reservationActionStates.delete(key);
    else if(state.action==='disable' && contract.isDisableComplete(item, key)) reservationActionStates.delete(key);
  }
}
function reservationPendingActionButton(r, fallback){
  const state=getReservationActionState(r&&r.id);
  if(!state || (state.action!=='stop' && state.action!=='cancel')) return fallback;
  return `<button class="rsv-btn program-cell-action-btn tvair-program-action-control tvair-action-button program-action-transient" data-program-action="${esc(state.action)}" data-action-role="reservation-action-pending" data-action-context="reservation-list-row" disabled aria-busy="true">${esc(state.text)}</button>`;
}
function reservationPendingToggleButton(r, fallback){
  const state=getReservationActionState(r&&r.id);
  if(!state || (state.action!=='enable' && state.action!=='disable')) return fallback;
  // ○/× is a compact state control, not a progress surface. Keep the current
  // symbol while the request is in flight and switch directly on canonical update.
  const currentEnabled=r && r.isEnabled!==false;
  return `<button class="tvair-reservation-toggle" data-state-role="reservation-toggle-pending" data-state-context="reservation-list-row" disabled aria-busy="true">${currentEnabled?'○':'×'}</button>`;
}
// ReservationSnapshotApplyContract:
// Every reservation-list request receives a monotonically increasing generation.
// Only the latest started request may publish its snapshot to allData/DOM. This keeps
// a slower pre-operation poll/focus refresh from overwriting a newer action result.
let reservationSnapshotRequestGeneration = 0;
function beginReservationSnapshotRequest(){
  reservationSnapshotRequestGeneration += 1;
  return reservationSnapshotRequestGeneration;
}
function invalidateReservationSnapshotPublication(){
  reservationSnapshotRequestGeneration += 1;
  return reservationSnapshotRequestGeneration;
}
function isCurrentReservationSnapshotRequest(generation){
  return generation === reservationSnapshotRequestGeneration;
}
function applyReservationSnapshot(generation, nextData, forceRender){
  if(!isCurrentReservationSnapshotRequest(generation)) return false;
  const nextSignature = stableSignature(nextData);
  const changed = nextSignature !== lastReservationSignature;
  publishCanonicalReservationSnapshot(nextData);
  reconcileReservationActionStates(allData);
  updateReservationColumnWidthVars();
  if(changed){
    lastReservationSignature = nextSignature;
    idleTick = 0;
  }
  if(hasRealtimeReservation(allData)) idleTick = 0;
  if(forceRender || changed) render();
  updateReservationColumnWidthVars();
  return true;
}
let userEvents = [];
let userEventsSignature = '';
let logPresentationSnapshot = null;
let logPresentationSignature = '';
let keywordGroups = [];
let taggedPrograms = { newprogram: [], finalepisode: [] };
let taggedLoading = { newprogram: false, finalepisode: false };
let taggedLoadedOnce = { newprogram: false, finalepisode: false };
let taggedRequestGeneration = { newprogram: 0, finalepisode: 0 };
let taggedRequestInFlight = { newprogram: null, finalepisode: null };
let reservationPageLoadInFlight = null;
let currentFilter = initialReservationFilterFromLocation();

function normalizeReservationFilterValue(value){
  const v = String(value || '').trim().toLowerCase();
  if(v === 'log' || v === 'logs' || v === 'done' || v === 'history') return 'done';
  if(v === 'keyword' || v === 'auto' || v === 'autosearch') return 'keyword';
  if(v === 'stations' || v === 'station' || v === 'channels') return 'stations';
  if(v === 'newprogram' || v === 'new-program' || v === 'new') return 'newprogram';
  if(v === 'finalepisode' || v === 'final-episode' || v === 'final') return 'finalepisode';
  return 'active';
}

function reservationFilterUrlToken(filter){
  const f = normalizeReservationFilterValue(filter);
  if(f === 'done') return 'log';
  return f;
}

function initialReservationFilterFromLocation(){
  try{
    const params = new URLSearchParams(window.location.search || '');
    const explicit = params.get('tab') || params.get('view') || params.get('filter');
    if(explicit) return normalizeReservationFilterValue(explicit);
    const hash = String(window.location.hash || '').replace(/^#/, '');
    if(hash) return normalizeReservationFilterValue(hash);
    const stored = sessionStorage.getItem('tvair_reservation_current_filter');
    if(stored) return normalizeReservationFilterValue(stored);
  }catch(_){ }
  return 'active';
}

function persistReservationFilterLocation(filter){
  const f = normalizeReservationFilterValue(filter);
  try{ sessionStorage.setItem('tvair_reservation_current_filter', f); }catch(_){ }
  try{
    if(!window.history || !window.history.replaceState) return;
    const url = new URL(window.location.href);
    if(f === 'active'){
      url.searchParams.delete('tab');
      url.searchParams.delete('view');
      url.searchParams.delete('filter');
    }else{
      url.searchParams.set('tab', reservationFilterUrlToken(f));
      url.searchParams.delete('view');
      url.searchParams.delete('filter');
    }
    window.history.replaceState(window.history.state || {}, '', url.pathname + url.search + url.hash);
  }catch(_){ }
}

function updateFilterTabActive(){
  const tabs = Array.from(document.querySelectorAll('.tvair-reservation-subtab'));
  const order = ['active','keyword','stations','newprogram','finalepisode','done'];
  tabs.forEach((t, i) => {
    t.classList.toggle('active', order[i] === normalizeReservationFilterValue(currentFilter));
  });
}
let keywordLoading = false;
let keywordLoadedOnce = false;
// release_contract: reservation sub-tabs share toolbar styling, but functional actions are materialized by tab capability.
// The operation log tab is a reservation-family list surface, not a genre-capable surface.
const reservationTabContracts = Object.freeze({
  active:       Object.freeze({ listRole:'reservation', supportsGenreColor:true,  supportsLogActions:false, supportsRefresh:true }),
  keyword:      Object.freeze({ listRole:'auto-search', supportsGenreColor:true,  supportsLogActions:false, supportsRefresh:true }),
  stations:     Object.freeze({ listRole:'service-list', supportsGenreColor:true,  supportsLogActions:false, supportsRefresh:true }),
  newprogram:   Object.freeze({ listRole:'new-program',  supportsGenreColor:true,  supportsLogActions:false, supportsRefresh:true }),
  finalepisode: Object.freeze({ listRole:'final-program',supportsGenreColor:true,  supportsLogActions:false, supportsRefresh:true }),
  done:         Object.freeze({ listRole:'log',          supportsGenreColor:false, supportsLogActions:true,  supportsRefresh:true })
});
const genreColorFilters = new Set(Object.keys(reservationTabContracts).filter(k => reservationTabContracts[k].supportsGenreColor));
let genreColorPrefs = loadGenreColorPrefs();

let reservationStationWidthSignature = '';
let reservationStationWidthCanvas = null;

function collectReservationStationNames(){
  const names = new Set();
  const add = (v) => {
    const text = String(v || '').trim();
    if(text && text !== '—' && text !== '（局名不明）') names.add(text);
  };

  // release_contract: reservation-family station width is derived from the current
  // channel contract only. Do not widen/narrow per tab, reservation data, stale DB
  // service names, keyword results, or tagged program rows. Channel renames must be
  // absorbed by /api/channels without a TvAIr code change.
  stationChannelMetaList.forEach(ch => add(ch.name || ch.channelArgument));
  stationGroupMetaMap.forEach(meta => add(meta.label));

  // Fail-soft only when channel metadata is unavailable. This keeps the table usable
  // but does not let ordinary reservation data become the width owner.
  if(names.size === 0){
    allData.forEach(r => add(r.serviceName || r.channelArgument));
    keywordGroups.forEach(group => {
      (group && Array.isArray(group.items) ? group.items : []).forEach(r => add(r.serviceName || r.channelArgument));
      (group && Array.isArray(group.reservations) ? group.reservations : []).forEach(r => add(r.serviceName || r.channelArgument));
    });
    Object.values(taggedPrograms).forEach(list => {
      (Array.isArray(list) ? list : []).forEach(ev => add(ev.serviceName || ev.channelName || ev.channelArgument));
    });
  }

  return Array.from(names).sort((a,b)=>a.localeCompare(b, 'ja'));
}

function measureReservationStationTextWidth(names){
  if(!names.length) return 0;
  if(!reservationStationWidthCanvas) reservationStationWidthCanvas = document.createElement('canvas');
  const ctx = reservationStationWidthCanvas.getContext('2d');
  if(!ctx) return Math.max(...names.map(x => x.length * 12));
  const sampleCell = document.querySelector('#rsv-table td.col-ch, #rsv-table th.col-ch');
  const style = sampleCell ? getComputedStyle(sampleCell) : null;
  ctx.font = style ? `${style.fontWeight || '400'} ${style.fontSize || '12px'} ${style.fontFamily || 'Meiryo, sans-serif'}` : '12px Meiryo, sans-serif';
  return Math.max(...names.map(x => ctx.measureText(x).width));
}

function readReservationCssPx(computed, name, fallback){
  const value = Number.parseFloat(computed.getPropertyValue(name));
  return Number.isFinite(value) && value > 0 ? value : fallback;
}

function estimateReservationTableAvailableWidth(){
  const tableWrap = document.getElementById('table-wrap');
  const keywordWrap = document.getElementById('keyword-wrap');
  const main = document.getElementById('main');
  const candidates = [
    tableWrap && tableWrap.clientWidth,
    keywordWrap && keywordWrap.clientWidth,
    main && main.clientWidth,
    document.documentElement.clientWidth
  ].filter(v => Number.isFinite(v) && v > 0);
  return candidates.length ? Math.max(...candidates) : 0;
}

function updateReservationColumnWidthVars(){
  const names = collectReservationStationNames();
  const tableWidth = Math.round(estimateReservationTableAvailableWidth());
  const signature = names.join('\u001f') + `|w=${tableWidth}`;
  if(signature === reservationStationWidthSignature) return false;
  reservationStationWidthSignature = signature;

  const root = document.documentElement;
  const bodyComputed = getComputedStyle(document.body);
  const rootComputed = getComputedStyle(root);
  const minWidth = Number.parseFloat(rootComputed.getPropertyValue('--rsv-col-channel-min')) || 150;
  const measuredText = measureReservationStationTextWidth(names);
  // Service/station column is semi-fixed: derive it from the current known service set,
  // not from the active tab/filter. The title column remains the only elastic absorber.
  const required = Math.ceil(measuredText + 26); // cell padding + safety room for half-width/antialiasing
  let width = Math.max(minWidth, required);

  const fixedReservationColumns =
    readReservationCssPx(bodyComputed, '--rsv-index-w', 36) +
    readReservationCssPx(bodyComputed, '--rsv-toggle-w', 56) +
    readReservationCssPx(bodyComputed, '--rsv-priority-w', 72) +
    readReservationCssPx(bodyComputed, '--rsv-date-w', 122) +
    readReservationCssPx(bodyComputed, '--rsv-time-w', 116) +
    readReservationCssPx(bodyComputed, '--rsv-source-w', 94) +
    readReservationCssPx(bodyComputed, '--rsv-action-w', 112);
  const minimumTitleColumn = 180;
  const safeRoom = 12;
  const maxByLayout = tableWidth > 0 ? Math.floor(tableWidth - fixedReservationColumns - minimumTitleColumn - safeRoom) : 0;
  if(maxByLayout > minWidth) width = Math.min(width, maxByLayout);

  root.style.setProperty('--rsv-col-channel', `${width}px`);
  root.style.setProperty('--tvair-col-service', `${width}px`);
  // release_contract: the log tab owns its own column balance. Do not let long
  // station names consume the log message column; keep the target readable
  // and give the remaining width to 内容.
  const logTargetWidth = Math.max(120, Math.min(width, 180));
  root.style.setProperty('--reservation-log-col-target', `${logTargetWidth}px`);
  return true;
}


const SPECIAL_GROUP_TITLES = {
  stations: '局名リスト',
  newprogram: '新番組',
  finalepisode: '最終回'
};

const RESERVATION_REFRESH_LABELS = {
  active: '予約一覧',
  keyword: '自動検索予約リスト',
  stations: '局名リスト',
  newprogram: '新番組',
  finalepisode: '最終回',
  done: 'ログ'
};
function currentReservationRefreshLabel(){
  return RESERVATION_REFRESH_LABELS[normalizeReservationFilterValue(currentFilter)] || '予約一覧';

const GENRE_COLORS = (window.TvAirGenre && window.TvAirGenre.COLORS) || {};

function loadGenreColorPrefs(){
  try{
    const raw = localStorage.getItem('tvair-reservation-genre-colors');
    const parsed = raw ? JSON.parse(raw) : {};
    return { active: !!parsed.active, keyword: !!parsed.keyword, stations: !!parsed.stations, newprogram: !!parsed.newprogram, finalepisode: !!parsed.finalepisode };
  }catch(_){
    return { active:false, keyword:false, stations:false, newprogram:false, finalepisode:false };
  }
}

function saveGenreColorPrefs(){
  try{ localStorage.setItem('tvair-reservation-genre-colors', JSON.stringify(genreColorPrefs)); }catch(_){ }
}

function isGenreColorEnabled(filter){
  return !!genreColorPrefs[filter];
}

function reservationTabContractForFilter(filter){
  return reservationTabContracts[filter] || reservationTabContracts.active;
}

function reservationListRoleForFilter(filter){
  return reservationTabContractForFilter(filter).listRole;
}

function reservationTabSupports(filter, capability){
  return !!reservationTabContractForFilter(filter)[capability];
}

function applyReservationListRole(){
  const role = reservationListRoleForFilter(currentFilter);
  document.body.setAttribute('data-filter', currentFilter || 'active');
  document.body.setAttribute('data-list-role', role);
  const table = document.getElementById('rsv-table');
  if(table) table.setAttribute('data-list-role', role);
  const tabs = document.getElementById('filter-tabs');
  if(tabs) tabs.setAttribute('data-list-role', role);
  const tableWrap = document.getElementById('table-wrap');
  if(tableWrap) tableWrap.setAttribute('data-list-role', role);
  const keywordWrap = document.getElementById('keyword-wrap');
  if(keywordWrap) keywordWrap.setAttribute('data-list-role', role);
}

function updateLogActionHost(){
  const host = document.getElementById('log-action-host');
  if(!host) return;
  const canShow = reservationTabSupports(currentFilter, 'supportsLogActions');
  host.hidden = !canShow;
  host.setAttribute('aria-hidden', canShow ? 'false' : 'true');
  if(!canShow){
    host.innerHTML = '';
    return;
  }
  if(!document.getElementById('report-log-btn')){
    host.innerHTML = '<button id="report-log-btn" class="tvair-log-action-button" data-action-role="log-copy" onclick="copyUserEventReport(this)">報告用コピー</button>'+
                     '<button id="clear-log-btn" class="tvair-log-action-button" data-action-role="log-clear" onclick="clearLogReservations(this)">一括削除</button>';
  }
}

function canShowGenreColorButtonForFilter(filter){
  return reservationTabSupports(filter, 'supportsGenreColor');
}

function updateGenreColorButton(){
  updateLogActionHost();
  const host = document.getElementById('genre-color-action-host');
  if(!host) return;
  const canShow = canShowGenreColorButtonForFilter(currentFilter);
  if(!canShow){
    host.innerHTML = '';
    host.setAttribute('aria-hidden', 'true');
    return;
  }
  host.setAttribute('aria-hidden', 'false');
  if(!document.getElementById('genre-color-btn')){
    host.innerHTML = '<button id="genre-color-btn" class="reservation-toolbar-action" data-toolbar-action="genre-color" onclick="toggleGenreColorForCurrentFilter()"></button>';
  }
  const btn = document.getElementById('genre-color-btn');
  if(!btn) return;
  const enabled = isGenreColorEnabled(currentFilter);
  btn.textContent = enabled ? 'ジャンル色：ON' : 'ジャンル色：OFF';
  btn.title = enabled ? '現在はジャンル色表示あり。押すとOFFになります。' : '現在はジャンル色表示なし。押すとONになります。';
}

function toggleGenreColorForCurrentFilter(){
  if(!canShowGenreColorButtonForFilter(currentFilter)) return;
  genreColorPrefs[currentFilter] = !isGenreColorEnabled(currentFilter);
  saveGenreColorPrefs();
  updateGenreColorButton();
  render();
  updateReservationScrollLayout();
}

function genreClsFromCodes(codes){
  return (window.TvAirGenre && window.TvAirGenre.codesToClass) ? window.TvAirGenre.codesToClass(codes) : 'g-other';
}

function genreClsFromItem(item){
  if(!item) return '';
  const codes = item.genreCodes || item.GenreCodes || item.genreCode || item.GenreCode || '';
  return String(codes || '').trim() ? genreClsFromCodes(codes) : '';
}

function buildGenreRowAttr(item){
  const cls = genreClsFromItem(item);
  const codes = String((item && (item.genreCodes || item.GenreCodes || item.genreCode || item.GenreCode)) || '');
  const source = codes.trim() ? 'epg-genre-codes' : 'none';
  return ` data-genre-class="${esc(cls)}" data-genre-source="${esc(source)}"`;
}

function buildGenreRowClass(item, state = {}){
  if(!canShowGenreColorButtonForFilter(currentFilter) || !isGenreColorEnabled(currentFilter)) return '';

  // Reservation row-state ownership contract:
  // Genre color is a data/background attribute, never a higher-priority row state.
  // Disabled/cancelled/conflicted/log rows must not receive genre row owner classes;
  // otherwise the genre background can fight the disabled/cancelled/conflict tokens.
  const statusKey = String((item && item.status) || '').toLowerCase();
  const isTerminal = statusKey === 'completed' || statusKey === 'cancelled' || statusKey === 'failed';
  const disabled = state.disabled === true || (!isTerminal && item && item.isEnabled === false);
  const cancelled = state.cancelled === true || statusKey === 'cancelled';
  const conflicted = state.conflicted === true;
  const logPlain = state.logPlain === true;
  if(disabled || cancelled || conflicted || logPlain) return '';

  const cls = genreClsFromItem(item);
  return cls ? ' tvair-reservation-genre-row ' + cls : '';
}

let genreColorSettingsSynced = false;

/* Reservation-row semantic DOM contract. */
function reservationStatusKey(r){
  return String((r && r.status) || '').toLowerCase();
}

function reservationIsTerminal(r){
  const statusKey = reservationStatusKey(r);
  return statusKey === 'completed' || statusKey === 'cancelled' || statusKey === 'failed';
}

function reservationIsActiveStatus(r){
  const statusKey = reservationStatusKey(r);
  return statusKey === 'scheduled' || statusKey === 'starting' || statusKey === 'recording' || statusKey === 'stopping';
}

function reservationHasDisplayAllocation(r){
  if(!r || r.source === 'epg') return false;
  if(!reservationIsActiveStatus(r)) return false;
  if(r.isEnabled === false || r.isConflicted === true) return false;
  return true;
}

function reservationDisplayTunerName(r, options){
  const opts = options || {};
  if(!r) return '';
  if(opts.logPlain || reservationIsTerminal(r)){
    return r.actualTunerName || r.priorityName || '';
  }

  // SYSTEM_EPG_PRIORITY_PRESENTATION_CONTRACT:
  // System EPG の PriorityName は予約一覧上の論理優先度であり、実行物理Tunerではない。
  // EPG確認/EPG取得とも同じ「優先度」列へそのまま表示する。source=epgを理由に消さない。
  if(r.source === 'epg') return r.priorityName || r.tunerName || '';

  if(!reservationHasDisplayAllocation(r)) return '';
  if(['starting','recording','stopping'].includes(reservationStatusKey(r))) return r.actualTunerName || r.priorityName || r.tunerName || '';
  return r.priorityName || r.tunerName || '';
}

function reservationSemanticState(r, options){
  const opts = options || {};
  const statusKey = reservationStatusKey(r);
  if(!opts.logPlain && r && r.isConflicted) return 'conflicted';
  if(statusKey === 'cancelled') return 'cancelled';
  if(statusKey === 'failed') return 'failed';
  if(statusKey === 'completed') return 'completed';
  if(!reservationIsTerminal(r) && r && r.isEnabled === false) return 'disabled';
  if(statusKey === 'stopping') return 'stopping';
  if(statusKey === 'recording') return 'recording';
  if(statusKey === 'starting') return 'starting';
  if(statusKey === 'scheduled' || statusKey === '') return 'scheduled';
  return statusKey || 'scheduled';
}

function reservationSystemEpgKind(r){
  if(!r || r.source !== 'epg') return '';
  return String(r.systemEpgKind || 'system-epg');
}

function reservationSemanticClass(r, options){
  const state = reservationSemanticState(r, options);
  const view = String(currentFilter || 'active').replace(/[^a-z0-9_-]/gi, '');
  const systemKind = reservationSystemEpgKind(r);
  const systemClass = systemKind ? ` tvair-reservation-system-${systemKind}` : '';
  return ` tvair-reservation-row tvair-reservation-view-${view} tvair-reservation-state-${state}${systemClass}`;
}

function reservationSemanticAttrs(r, options){
  const state = reservationSemanticState(r, options);
  const view = String(currentFilter || 'active').replace(/[^a-z0-9_-]/gi, '');
  const systemKind = reservationSystemEpgKind(r);
  const systemAttrs = systemKind ? ` data-row-role="system-epg-event" data-system-epg-kind="${systemKind}"` : '';
  return ` data-view-mode="${view}" data-reservation-state="${state}"${systemAttrs}`;
}

function reservationEventKey(x){
  return `${x.networkId}:${x.transportStreamId}:${x.serviceId}:${x.eventId}`;
}

function reservationFrameKey(x){
  const st = new Date((x && (x.startTime || x.start)) || '').getTime();
  const en = new Date((x && (x.endTime || x.end)) || '').getTime();
  const base = reservationEventKey(x || {});
  if(Number.isFinite(st) && Number.isFinite(en)) return `${base}:${st}:${en}`;
  return base;
}

function findActiveReservationForEvent(ev){
  const key = reservationFrameKey(ev);
  return allData.find(r => reservationIsActiveStatus(r) && r.source !== 'epg' && reservationFrameKey(r) === key) || null;
}

function p2(n){ return String(n).padStart(2,'0'); }
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function fmtDate(s){
  const d = new Date(s);
  const dow = ['日','月','火','水','木','金','土'][d.getDay()];
  return `${d.getFullYear()}/${p2(d.getMonth()+1)}/${p2(d.getDate())}(${dow})`;
}
function fmtTime(s, e){
  const ds = new Date(s), de = new Date(e);
  return `${p2(ds.getHours())}:${p2(ds.getMinutes())}〜${p2(de.getHours())}:${p2(de.getMinutes())}`;
}
function fmtDateTime(s){
  const d = new Date(s);
  if(Number.isNaN(d.getTime())) return '—';
  return `${d.getFullYear()}/${p2(d.getMonth()+1)}/${p2(d.getDate())} ${p2(d.getHours())}:${p2(d.getMinutes())}:${p2(d.getSeconds())}`;
}
function userLogSeverityClass(e){
  const sev = String((e && e.severity) || '').toLowerCase();
  if(sev === 'error') return ' user-log-error';
  if(sev === 'warn' || sev === 'warning') return ' user-log-warn';
  return ' user-log-info';
}
function fmtDur(s, e){
  const m = Math.round((new Date(e) - new Date(s)) / 60000);
  return m >= 60 ? `${Math.floor(m/60)}h${m%60 ? m%60+'m' : ''}` : `${m}m`;
}

async function readJsonSafely(response, fallback){
  if(!response || !response.ok) return fallback;
  const text = await response.text();
  if(!text || !text.trim()) return fallback;
  try{
    return JSON.parse(text);
  }catch(_){
    return fallback;
  }
}

async function loadKeywordReservations(showError=false){
  keywordLoading = true;
  if(currentFilter === 'keyword') render();
  try{
    const response = await fetch('/api/keyword-rule-reservations');
    keywordGroups = await readJsonSafely(response, []);
    keywordLoadedOnce = true;
    if(showError && (!response || !response.ok)){
      showToast('取得エラー: 自動検索予約一覧の取得に失敗しました。');
    }
  }catch(_){
    keywordGroups = [];
    keywordLoadedOnce = true;
    if(showError) showToast('取得エラー: 自動検索予約一覧の取得に失敗しました。');
  }finally{
    keywordLoading = false;
    if(currentFilter === 'keyword') render();
  }
}


function isSafeTaggedProgramClientSide(ev){
  const title = String((ev && ev.title) || '').trim();
  if(!title) return false;
  const compact = title.replace(/\s+/g,'');
  const removedTags = compact
    .replace(/\[新\]|［新］|【新】|\[終\]|［終］|【終】|\[初\]|［初］|【初】/g,'')
    .replace(/\[字\]|［字］|\[二\]|［二］|\[無\]|［無］|\[生\]|［生］/g,'');
  if(/^(\[新\]|［新］|【新】|\[終\]|［終］|【終】|\[初\]|［初］|【初】).{0,4}$/.test(compact)) return false;
  if(removedTags.length <= 2) return false;
  return true;
}

async function loadTaggedPrograms(kind, showError=false){
  if(kind !== 'newprogram' && kind !== 'finalepisode') return false;

  // One request owns each tagged-program snapshot. Focus, visibility and poll may
  // request the same refresh together; reuse the active request instead of racing
  // multiple responses against the last known-good snapshot.
  if(taggedRequestInFlight[kind]) return taggedRequestInFlight[kind];

  const generation = ++taggedRequestGeneration[kind];
  taggedLoading[kind] = true;
  if(currentFilter === kind) render();

  const request = (async () => {
    try{
      const response = await fetch(`/api/epg/tagged?kind=${encodeURIComponent(kind)}`, { cache:'no-store' }).catch(()=>null);
      if(!response || !response.ok){
        if(showError && !taggedLoadedOnce[kind]) showToast(`取得エラー: ${SPECIAL_GROUP_TITLES[kind]}の取得に失敗しました。`);
        return false;
      }

      const data = await readJsonSafely(response, null);
      if(generation !== taggedRequestGeneration[kind] || !data || !Array.isArray(data.events)) return false;

      // An empty list is authoritative only when a successful response explicitly
      // returned events=[]. Transport/parse failures retain the last good snapshot.
      taggedPrograms[kind] = data.events.filter(isSafeTaggedProgramClientSide);
      taggedLoadedOnce[kind] = true;
      return true;
    }catch(_){
      if(showError && !taggedLoadedOnce[kind]) showToast(`取得エラー: ${SPECIAL_GROUP_TITLES[kind]}の取得に失敗しました。`);
      return false;
    }finally{
      if(generation === taggedRequestGeneration[kind]){
        taggedLoading[kind] = false;
        taggedRequestInFlight[kind] = null;
        if(currentFilter === kind) render();
      }
    }
  })();

  taggedRequestInFlight[kind] = request;
  return request;
}

async function loadUserEvents(showError=false){
  try{
    const response = await fetch('/api/user-events?count=100', { cache:'no-store' }).catch(()=>null);
    const nextEvents = await readJsonSafely(response, []);
    const sig = stableSignature(nextEvents);
    const changed = sig !== userEventsSignature;
    userEvents = Array.isArray(nextEvents) ? nextEvents : [];
    if(changed) userEventsSignature = sig;
    if(showError && (!response || !response.ok)) showToast('取得エラー: ログの取得に失敗しました。');
    if(currentFilter === 'done' && changed) render();
    return changed;
  }catch(_){
    if(showError) showToast('取得エラー: ログの取得に失敗しました。');
    return false;
  }
}

async function loadLogPresentation(showError=false){
  try{
    const response = await fetch('/api/log-presentation/reservation-log', { cache:'no-store' }).catch(()=>null);
    const payload = await readJsonSafely(response, null);
    const activeSnapshot = payload && payload.active === true && payload.snapshot ? {
      sourcePluginId: payload.sourcePluginId || '',
      snapshot: payload.snapshot
    } : null;
    const sig = stableSignature(activeSnapshot);
    const changed = sig !== logPresentationSignature;
    logPresentationSnapshot = activeSnapshot;
    if(changed) logPresentationSignature = sig;
    if(showError && (!response || !response.ok)) showToast('取得エラー: ログ表示の取得に失敗しました。');
    if(currentFilter === 'done' && changed) render();
    return changed;
  }catch(_){
    logPresentationSnapshot = null;
    if(showError) showToast('取得エラー: ログ表示の取得に失敗しました。');
    return false;
  }
}

function hasActiveLogPresentation(){
  const snap = logPresentationSnapshot && logPresentationSnapshot.snapshot;
  return !!(snap && Array.isArray(snap.entries) && snap.replaceHostDefault !== false);
}

function logPresentationSeverityClass(e){
  const s = String((e && (e.severity || e.result)) || '').toLowerCase();
  if(s.includes('error') || s.includes('failed') || s.includes('fail') || s.includes('異常') || s.includes('失敗')) return ' user-log-error';
  if(s.includes('warn') || s.includes('注意') || s.includes('警告')) return ' user-log-warn';
  return ' user-log-info';
}


function logPresentationTargetModel(e){
  return {
    target: String((e && e.target) || '').trim() || '—',
    targetTextMode: 'singleline'
  };
}

function logPresentationMessage(e){
  return String((e && e.message) || '').trim() || '—';
}

function renderLogPresentationRows(tbody, empty){
  const snap = logPresentationSnapshot && logPresentationSnapshot.snapshot;
  const rows = Array.isArray(snap && snap.entries) ? [...snap.entries] : [];
  if(rows.length === 0){
    tbody.innerHTML = '';
    empty.style.display = 'block';
    empty.textContent = '表示するログはありません';
    return;
  }
  empty.style.display = 'none';
  tbody.innerHTML = rows.map((e, i) => {
    const rowClass = `row-${i % 2 === 0 ? 'odd' : 'even'} tvair-user-log-row${logPresentationSeverityClass(e)}`;
    const category = e.category || (snap && snap.title) || 'ログ';
    const result = e.result || e.severity || '—';
    const targetModel = logPresentationTargetModel(e);
    const message = logPresentationMessage(e);
    return `<tr class="${rowClass}" data-list-role="log" data-log-source="plugin-presentation">
      <td class="col-no tvair-user-log-index-cell" data-cell-role="log-index">${i + 1}</td>
      <td class="col-datetime tvair-user-log-datetime-cell" data-cell-role="log-datetime">${fmtDateTime(e.timestamp)}</td>
      <td class="col-kind tvair-user-log-kind-cell" data-cell-role="log-kind">${esc(category)}</td>
      ${TvAIrUserLog.renderResultCell(e, esc)}
      ${TvAIrUserLog.renderTargetCell(targetModel, esc)}
      ${TvAIrUserLog.renderMessageCell({ message, messageTextMode: e.messageTextMode }, esc)}
    </tr>`;
  }).join('');
}

async function loadCore(forceRender=false){
  const requestGeneration = beginReservationSnapshotRequest();
  await ensureReservationGenreColorsSynced();
  const reservationResponse = await fetch('/api/reservations', { cache:'no-store' }).catch(()=>null);
  const nextData = await readJsonSafely(reservationResponse, []);
  await loadStationChannelMeta();

  // A newer action/poll already owns publication. Do not let this older full refresh
  // alter allData, render ancillary sections against an obsolete reservation snapshot,
  // or surface an obsolete request error.
  if(!isCurrentReservationSnapshotRequest(requestGeneration)) return false;

  if(!reservationResponse || !reservationResponse.ok){
    if(currentFilter !== 'keyword' && currentFilter !== 'done'){
      showToast('取得エラー: 予約一覧の取得に失敗しました。');
    }
    return false;
  }

  const reservationChanged = stableSignature(nextData) !== lastReservationSignature;
  applyReservationSnapshot(requestGeneration, nextData, forceRender);

  const userEventsChanged = await loadUserEvents(currentFilter === 'done');
  const logPresentationChanged = await loadLogPresentation(currentFilter === 'done');
  if(!isCurrentReservationSnapshotRequest(requestGeneration)) return false;
  if(currentFilter === 'done' && (userEventsChanged || logPresentationChanged) && !reservationChanged) render();

  await loadKeywordReservations(currentFilter === 'keyword');
  // Only the visible candidate tab owns a background refresh. Previously every
  // visited candidate tab was refreshed on focus, visibility and poll, causing
  // duplicate 7-day EPG requests and competing renders.
  if(currentFilter === 'newprogram' || currentFilter === 'finalepisode') {
    await loadTaggedPrograms(currentFilter, false);
  }
  if(!isCurrentReservationSnapshotRequest(requestGeneration)) return false;
  updateReservationColumnWidthVars();
  return true;
}

async function load(forceRender=false){
  // One page-wide refresh owns reservation, log, keyword and active tagged-tab
  // publication. Focus, visibilitychange and poll share the same in-flight work.
  if(reservationPageLoadInFlight) return reservationPageLoadInFlight;
  const request = loadCore(forceRender).finally(() => {
    if(reservationPageLoadInFlight === request) reservationPageLoadInFlight = null;
  });
  reservationPageLoadInFlight = request;
  return request;
}


async function reloadReservationRowsOnly(forceRender=true){
  // release_contract ReservationListActionRefreshContract:
  // Row-level actions only need the reservation list as their immediate UI source.
  // All reservation snapshots share the same publication generation, so an older
  // poll/focus request can never overwrite this action result afterward.
  const requestGeneration = beginReservationSnapshotRequest();
  const reservationResponse = await fetch('/api/reservations', { cache:'no-store' }).catch(()=>null);
  const nextData = await readJsonSafely(reservationResponse, []);
  if(!isCurrentReservationSnapshotRequest(requestGeneration)) return false;
  if(!reservationResponse || !reservationResponse.ok){
    showToast('取得エラー: 予約一覧の取得に失敗しました。');
    return false;
  }
  return applyReservationSnapshot(requestGeneration, nextData, forceRender);
}

async function refreshReservations(btn){
  if(btn) btn.disabled = true;
  const originalText = btn ? btn.textContent : '';
  const refreshLabel = currentReservationRefreshLabel();
  if(btn) btn.textContent = window.TvAirActionButtonState.processingText;
  try{
    // release_contract ReservationListManualRefreshContract:
    // Manual refresh is a canonical snapshot read only.  Reservation/allocation state
    // must already be settled by the operation that changed it; this button must not
    // re-run rule synchronization, allocation, PreRecEpg, or Wake reconstruction.
    const applied = await reloadReservationRowsOnly(true);
    if(applied && currentFilter === 'keyword') await loadKeywordReservations(false);
    if(!applied){
      showToast(`${refreshLabel}の更新に失敗しました。`, 3200, 'error');
      return;
    }
    scheduleNextPoll(true);
    showToast(`${refreshLabel}を更新しました。`);
  }catch(_){
    showToast(`${refreshLabel}の更新に失敗しました。`, 3200, 'error');
  }finally{
    if(btn){
      btn.disabled = false;
      btn.textContent = originalText || '↻ 更新';
    }
  }
}

function updateReservationScrollLayout(){
  // release_contract: ListGrid owns the column contract. JS only supplies the semi-fixed
  // service/station width derived from the current known service set.
  updateReservationColumnWidthVars();
}


function setFilter(f, el){
  currentFilter = normalizeReservationFilterValue(f);
  persistReservationFilterLocation(currentFilter);
  applyReservationListRole();
  document.querySelectorAll('.tvair-reservation-subtab').forEach(t => t.classList.remove('active'));
  if(el) el.classList.add('active');
  else updateFilterTabActive();
  updateGenreColorButton();
  if(f === 'keyword'){
    if(!keywordLoadedOnce) keywordLoading = true;
    render();
    loadKeywordReservations(true);
    return;
  }
  if(f === 'newprogram' || f === 'finalepisode'){
    if(!taggedLoadedOnce[f]) taggedLoading[f] = true;
    render();
    loadTaggedPrograms(f, true);
    return;
  }
  if(f === 'done'){
    render();
    Promise.all([loadUserEvents(true), loadLogPresentation(true)]).then(() => {
      if(currentFilter === 'done'){
        render();
        updateReservationScrollLayout();
      }
    });
    return;
  }
  render();
}

function getFiltered(){
  // 予約一覧タブ: scheduled + recording 両方表示
  if(currentFilter === 'active')   return allData.filter(r => ['scheduled','starting','recording','stopping'].includes(String(r.status || '').toLowerCase()));
  if(currentFilter === 'done')     return allData.filter(r => {
    if(!r || r.source === 'epg') return false;
    const status = String(r.status || '').toLowerCase();
    const started = !!(r.hasRecordingStarted || r.recordingStartedAt || r.actualTunerName);
    if(status === 'completed') return started;
    if(status === 'cancelled') return started;
    if(status === 'failed') return true;
    return false;
  });
  return allData;
}

function normalizeConflictTitle(title){
  let value = String(title || '').replace(/^\s+/, '');
  while(true){
    const updated = value.replace(/^(?:【競合(?::\s*[^】]+)?】|\[競合(?::\s*[^\]]+)?\]|［競合(?::\s*[^］]+)?］)\s*/, '');
    if(updated === value) break;
    value = updated.replace(/^\s+/, '');
  }
  return value;
}

function buildConflictPrefix(r){
  if(!r || !r.isConflicted) return '';
  const id = Number(r.id || 0);
  return '';
}

function buildDisplayTitle(r){
  const baseTitle = normalizeConflictTitle(r && (r.titleDisplay || r.title || ''));
  const prefix = buildConflictPrefix(r);
  if(prefix){
    const stripped = normalizeConflictTitle(baseTitle);
    return `${prefix}${stripped}`;
  }
  return baseTitle;
}

function hasDisplayConflict(r){
  // RESERVATION_CONFLICT_PROJECTION_SINGLE_SOURCE:
  // UIはサーバーがFinalAllocationCommitから投影したisConflictedだけを競合正本として使う。
  // 時刻重複やProgramGuideMissingからブラウザ側で別競合を再構築しない。
  return !!(r && r.isConflicted);
}


function isReservationListGroupingRow(r){
  return r && r.source !== 'epg';
}

function isListVisibleReservation(r){
  const status = String((r && r.status) || '').toLowerCase();
  return status === 'scheduled' || status === 'starting' || status === 'recording' || status === 'stopping';
}



/* TS GROUPING START */
let stationChannelMetaList = [];
let stationGroupMetaMap = new Map();

function normalizeStationChannel(raw){
  return {
    group: String(raw.group || raw.Group || '').trim().toUpperCase(),
    originalNetworkId: Number(raw.originalNetworkId ?? raw.OriginalNetworkId ?? raw.networkId ?? raw.NetworkId ?? 0),
    transportStreamId: Number(raw.transportStreamId ?? raw.TransportStreamId ?? 0),
    serviceId: Number(raw.serviceId ?? raw.ServiceId ?? 0),
    name: String(raw.name || raw.Name || raw.serviceName || raw.ServiceName || '').trim(),
    channelArgument: String(raw.channelArgument || raw.ChannelArgument || '').trim()
  };
}

function getStationGroupKeyFromMeta(ch){
  if(!ch) return '';
  if(ch.group === 'GR'){
    return `GR:${ch.originalNetworkId}:${ch.transportStreamId}`;
  }
  return `SV:${ch.originalNetworkId}:${ch.transportStreamId}:${ch.serviceId}`;
}

function getStationKey(r){
  const onid = Number(r.networkId || r.NetworkId || 0);
  const tsid = Number(r.transportStreamId || r.TransportStreamId || 0);
  const sid = Number(r.serviceId || r.ServiceId || 0);

  const exact = stationChannelMetaList.find(ch =>
    ch.originalNetworkId === onid &&
    ch.transportStreamId === tsid &&
    ch.serviceId === sid
  );
  if(exact){
    return getStationGroupKeyFromMeta(exact);
  }

  const gr = stationChannelMetaList.find(ch =>
    ch.group === 'GR' &&
    ch.originalNetworkId === onid &&
    ch.transportStreamId === tsid
  );
  if(gr){
    return getStationGroupKeyFromMeta(gr);
  }

  if(onid && tsid){
    if(r.group === 'GR' || r.Group === 'GR'){
      return `GR:${onid}:${tsid}`;
    }
    return `SV:${onid}:${tsid}:${sid}`;
  }

  return `NAME:${String(r.serviceName || r.channelArgument || '（局名不明）').trim() || '（局名不明）'}`;
}

function getStationGroupMeta(item){
  const key = getStationKey(item);
  const stored = stationGroupMetaMap.get(key);
  if(stored) return stored;
  return {
    key,
    label: String(item.serviceName || item.channelArgument || '（局名不明）').trim() || '（局名不明）',
    order: Number.MAX_SAFE_INTEGER
  };
}

function getDisplayServiceName(item){
  const meta = getStationGroupMeta(item || {});
  const label = String(meta && meta.label || '').trim();
  if(label && label !== '（局名不明）') return label;
  return String((item && (item.serviceName || item.channelName || item.channelArgument)) || '—').trim() || '—';
}

async function loadStationChannelMeta(){
  try{
    const response = await fetch('/api/channels').catch(()=>null);
    const json = await readJsonSafely(response, { channels: [] });
    const list = Array.isArray(json && json.channels) ? json.channels.map(normalizeStationChannel) : [];
    stationChannelMetaList = list;
    stationGroupMetaMap = new Map();

    list.forEach((ch, index) => {
      const key = getStationGroupKeyFromMeta(ch);
      if(!key || stationGroupMetaMap.has(key)) return;
      stationGroupMetaMap.set(key, {
        key,
        label: ch.name || ch.channelArgument || '（局名不明）',
        order: index
      });
    });
  }catch(_){
    stationChannelMetaList = [];
    stationGroupMetaMap = new Map();
  }
}
/* TS GROUPING END */

function getSpecialGroups(){
  const items = allData
    .filter(isReservationListGroupingRow)
    .filter(isListVisibleReservation)
    .slice()
    .sort((a,b)=>new Date(a.startTime)-new Date(b.startTime) || String(a.serviceName||'').localeCompare(String(b.serviceName||''), 'ja') || String(a.title||'').localeCompare(String(b.title||''), 'ja'));

  if(currentFilter === 'stations'){
    const groups = new Map();
    items.forEach(item => {
      const meta = getStationGroupMeta(item);
      if(!groups.has(meta.key)){
        groups.set(meta.key, {
          groupName: meta.label,
          order: meta.order,
          items: []
        });
      }
      groups.get(meta.key).items.push(item);
    });
    return Array.from(groups.values())
      .sort((a,b)=>{
        if(a.order !== b.order) return a.order - b.order;
        return String(a.groupName || '').localeCompare(String(b.groupName || ''), 'ja');
      })
      .map(group => ({ groupName: group.groupName, items: group.items, mode: 'reservation' }));
  }

  if(currentFilter === 'newprogram' || currentFilter === 'finalepisode'){
    return [{ groupName: SPECIAL_GROUP_TITLES[currentFilter], items: taggedPrograms[currentFilter] || [], mode: 'candidate' }];
  }

  return [];
}


/* Post-render guard only; state should normally be emitted at row generation time. */
function normalizeReservationFamilySemanticRows(root){
  const scope = root || document;
  const rows = scope.querySelectorAll('table.tvair-reservation-family-table tbody tr, #rsv-body > tr');
  rows.forEach(tr => {
    const state = tr.getAttribute('data-reservation-state') || '';
    if(state){
      tr.classList.add('tvair-reservation-row', `tvair-reservation-state-${state}`);
    }
    if(state === 'disabled') tr.classList.add('disabled-row');
    if(state === 'cancelled') tr.classList.add('cancelled-row');
    if(state === 'conflicted') tr.classList.add('conflicted');
  });
}

function buildReservationEnabledToggle(r){
  const canonical = resolveCanonicalReservation(r);
  if(!canonical) return `<span class="col-no" data-state-role="reservation-toggle-none" data-state-context="reservation-list-row">—</span>`;
  const statusKey = String(canonical.status || '').toLowerCase();
  const isRecording = statusKey === 'recording';
  const isDone = statusKey === 'completed' || statusKey === 'cancelled' || statusKey === 'failed';
  const isEnabled = canonical.isEnabled !== false;
  let button;
  if(currentFilter === 'done' || isDone || canonical.canToggleEnabled !== true){
    button = `<span class="col-no" data-state-role="reservation-toggle-none" data-state-context="reservation-list-row">—</span>`;
  } else if(isEnabled){
    button = `<button class="tvair-reservation-toggle" data-state-role="reservation-enabled-state" data-state-label="録画する" data-state-context="reservation-list-row" onclick="toggleEnabled(${canonical.id},false,this)"${isRecording ? ' disabled title="録画中は変更不可"' : ''}>○</button>`;
  } else {
    button = `<button class="tvair-reservation-toggle" data-state-role="reservation-disabled-state" data-state-label="録画しない" data-state-context="reservation-list-row" onclick="toggleEnabled(${canonical.id},true,this)">×</button>`;
  }
  return reservationPendingToggleButton(canonical, button);
}

function render(){
  applyReservationListRole();
  updateLogActionHost();
  updateReservationTableStructure();
  const tableWrap = document.getElementById('table-wrap');
  const keywordWrap = document.getElementById('keyword-wrap');
  const empty = document.getElementById('empty');

  if(currentFilter === 'keyword'){
    renderKeywordGroups();
    return;
  }

  if(currentFilter === 'stations' || currentFilter === 'newprogram' || currentFilter === 'finalepisode'){
    renderSpecialGroups();
    return;
  }

  tableWrap.style.display = 'block';
  keywordWrap.style.display = 'none';
  empty.textContent = '該当する予約はありません';

  const tbody = document.getElementById('rsv-body');

  if(currentFilter === 'done'){
    if(hasActiveLogPresentation()){
      renderLogPresentationRows(tbody, empty);
      updateReservationScrollLayout();
      return;
    }
    const rows = [...userEvents].sort((a,b)=> new Date(b.createdAt) - new Date(a.createdAt));
    if(rows.length === 0){ tbody.innerHTML = ''; empty.style.display = 'block'; empty.textContent = '表示するユーザー向けログはありません'; return; }
    empty.style.display = 'none';
    tbody.innerHTML = rows.map((e, i) => {
      const rowClass = `row-${i % 2 === 0 ? 'odd' : 'even'} tvair-user-log-row${userLogSeverityClass(e)}`;
      return `<tr class="${rowClass}" data-list-role="log">
        <td class="col-no tvair-user-log-index-cell" data-cell-role="log-index">${i + 1}</td>
        <td class="col-datetime tvair-user-log-datetime-cell" data-cell-role="log-datetime">${fmtDateTime(e.createdAt)}</td>
        <td class="col-kind tvair-user-log-kind-cell" data-cell-role="log-kind">${esc(e.category || '—')}</td>
        ${TvAIrUserLog.renderResultCell(e, esc)}
        ${TvAIrUserLog.renderTargetCell(e, esc)}
        ${TvAIrUserLog.renderMessageCell(e, esc)}
      </tr>`;
    }).join('');
    updateReservationScrollLayout();
    return;
  }

  const rows = [...getFiltered()].sort((a, b) => new Date(a.startTime) - new Date(b.startTime));

  if(rows.length === 0){ tbody.innerHTML = ''; empty.style.display = 'block'; return; }
  empty.style.display = 'none';

  tbody.innerHTML = rows.map((r, i) => {
    const isRecording = r.status === 'recording';
    const isDone      = r.status === 'completed' || r.status === 'cancelled' || r.status === 'failed';
    const isEnabled   = r.isEnabled !== false;
    const isEpg       = r.source === 'epg';
    const canToggleEnabled = r.canToggleEnabled === true;
    const canCancel = r.canCancel === true;

    // All reservation-family tabs use the same canonical toggle projection.
    const toggleBtn = buildReservationEnabledToggle(r);

    const displayTunerName = reservationDisplayTunerName(r, { logPlain: currentFilter === 'done' });
    const explicitChainMark = !!(r.chainRole && r.chainRole !== 'tail' && r.source !== 'keyword' && r.source !== 'epg' && r.source !== 'system');
    const tunerText = (displayTunerName || '—') + (explicitChainMark ? '（C）' : '');
    const tunerCell = currentFilter === 'done'
      ? `<span class="tuner-normal">${esc(tunerText)}</span>`
      : (hasDisplayConflict(r)
        ? `<span class="tuner-conflict">競合</span>`
        : `<span class="tuner-normal">${esc(tunerText)}</span>`);

    // 局名
    const chName = getDisplayServiceName(r);
    const chCell = esc(chName);

    // タイトル（EPGエントリは青文字イタリック）
    const titleClass = isEpg ? 'title-epg' : 'title-normal';

    // 操作ボタン（EPGエントリは操作なし）
    // scheduled の「解除」ボタンを撤去。予約の能動的意思表示は◯✗トグルに集約。
    // 横断的な予約リスト表示(予約一覧 / 自動検索予約リスト / 局名リスト)で
    // 同じ◯✗状態を維持することに設計上の意味がある。
    let actionBtn;
    if(currentFilter === 'done'){
      actionBtn = `<span class="reservation-action-empty" data-state-role="empty-action-cell" data-state-context="reservation-list-row">—</span>`;
    } else if(isRecording){
      // release_contract: プログラム予約も実行後は共通停止ルートで止められるようにする。
      actionBtn = `<button class="rsv-btn program-cell-action-btn tvair-program-action-control tvair-action-button" data-program-action="stop" data-action-role="recording-stop" data-action-label="録画停止" data-action-context="reservation-list-row" onclick="stopRec(${r.id},this)">録画停止</button>`;
    } else if(canCancel){
      actionBtn = `<button class="rsv-btn program-cell-action-btn tvair-program-action-control tvair-action-button" data-program-action="cancel" data-action-role="reservation-cancel" data-action-label="予約取消" data-action-context="reservation-list-row" onclick="cancelReservation(${r.id},this)">予約取消</button>`;
    } else if(isEpg){
      actionBtn = `<span class="reservation-action-empty" data-state-role="empty-action-cell" data-state-context="reservation-list-row">—</span>`;
    } else if(r.status === 'scheduled'){
      // scheduled は操作なし(◯✗トグルで意思表示する)
      actionBtn = `<span class="reservation-action-empty" data-state-role="empty-action-cell" data-state-context="reservation-list-row">—</span>`;
    } else {
      actionBtn = `<span class="reservation-action-empty" data-state-role="empty-action-cell" data-state-context="reservation-list-row">—</span>`;
    }
    actionBtn = reservationPendingActionButton(r, actionBtn);

    const logPlain = currentFilter === 'done';
    const displayConflict = !logPlain && hasDisplayConflict(r);
    const conflictClass = displayConflict ? ' conflicted' : '';
    const disabledClass = (!logPlain && !isDone && !isEnabled) ? ' disabled-row' : '';
    const cancelledClass = (!logPlain && r.status === 'cancelled') ? ' cancelled-row' : '';
    const chainClass    = (!logPlain && explicitChainMark) ? ` chain-${r.chainRole}` : '';
    const rowClass = `row-${i % 2 === 0 ? 'odd' : 'even'}${conflictClass}${disabledClass}${cancelledClass}${chainClass}`;

    const rowAttr = buildGenreRowAttr(r);
    const genreClass = buildGenreRowClass(r, {
      disabled: !!disabledClass,
      cancelled: !!cancelledClass,
      conflicted: displayConflict,
      logPlain
    });
    if(currentFilter === 'done'){
      return `<tr class="${rowClass}${reservationSemanticClass(r,{ logPlain })}${genreClass}" data-reservation-id="${r.id}" data-reservation-source="${esc(r.source || '')}"${reservationSemanticAttrs(r,{ logPlain })}${rowAttr}>
        <td class="col-no tvair-genre-list-index-cell tvair-reservation-list-index-cell" data-cell-role="list-index">${i + 1}</td>
        <td class="col-tuner tvair-genre-list-text-cell tvair-reservation-list-text-cell" data-cell-role="priority-metadata">${tunerCell}</td>
        <td class="col-date tvair-genre-list-text-cell tvair-reservation-list-text-cell" data-cell-role="date-metadata">${fmtDate(r.startTime)}</td>
        <td class="col-time tvair-genre-list-text-cell tvair-reservation-list-text-cell" data-cell-role="time-metadata">${fmtTime(r.startTime, r.endTime)}</td>
        <td class="col-ch tvair-genre-list-text-cell tvair-reservation-list-text-cell" data-cell-role="service-metadata">${chCell}</td>
        <td class="col-title tvair-genre-list-text-cell tvair-reservation-list-text-cell ${titleClass}" data-cell-role="title-data">${esc(buildDisplayTitle(r))}</td>
        <td class="col-status tvair-genre-list-text-cell tvair-reservation-list-text-cell" data-cell-role="source-metadata"><span class="source-label" data-state-role="source-label">${esc(r.sourceLabel || "—")}</span></td>
      </tr>`;
    }

    return `<tr class="${rowClass}${reservationSemanticClass(r,{ logPlain })}${genreClass}" data-reservation-id="${r.id}" data-reservation-source="${esc(r.source || '')}"${reservationSemanticAttrs(r,{ logPlain })}${rowAttr}>
      <td class="col-no tvair-genre-list-index-cell tvair-reservation-list-index-cell" data-cell-role="list-index">${i + 1}</td>
      <td class="col-toggle tvair-reservation-state-cell" data-cell-role="reservation-state">${toggleBtn}</td>
      <td class="col-tuner tvair-genre-list-text-cell tvair-reservation-list-text-cell" data-cell-role="priority-metadata">${tunerCell}</td>
      <td class="col-date tvair-genre-list-text-cell tvair-reservation-list-text-cell" data-cell-role="date-metadata">${fmtDate(r.startTime)}</td>
      <td class="col-time tvair-genre-list-text-cell tvair-reservation-list-text-cell" data-cell-role="time-metadata">${fmtTime(r.startTime, r.endTime)}</td>
      <td class="col-ch tvair-genre-list-text-cell tvair-reservation-list-text-cell" data-cell-role="service-metadata">${chCell}</td>
      <td class="col-title tvair-genre-list-text-cell tvair-reservation-list-text-cell ${titleClass}" data-cell-role="title-data">${esc(buildDisplayTitle(r))}</td>
      <td class="col-status tvair-genre-list-text-cell tvair-reservation-list-text-cell" data-cell-role="source-metadata"><span class="source-label" data-state-role="source-label">${esc(r.sourceLabel || "—")}</span></td>
      <td class="col-action tvair-reservation-action-cell" data-cell-role="reservation-action"><div class="reservation-action-slot">${actionBtn}</div></td>
    </tr>`;
  }).join('');
  normalizeReservationFamilySemanticRows(tbody);
  updateReservationScrollLayout();
}

async function reserveTaggedProgram(ev, btn){
  const timeAction=window.TvAirProgramTimeAction.resolve(ev, 'manual');
  if(timeAction.action==='none' || btn.dataset.programAction!==timeAction.action){
    renderSpecialGroups();
    return;
  }
  btn.disabled = true;
  const original = btn.textContent;
  btn.textContent = window.TvAirActionButtonState.processingText;
  try{
    const reservationUrl = '/api/reservations';
    const res = await fetch(reservationUrl,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        networkId:ev.networkId,
        transportStreamId:ev.transportStreamId,
        serviceId:ev.serviceId,
        eventId:ev.eventId,
        title:ev.title,
        startTime:ev.start,
        endTime:ev.end,
        status:timeAction.status,
        source:timeAction.source
      })
    });
    let data = {};
    try{ data = await res.json(); }catch(_){ }
    if(res.ok){
      btn.textContent = window.TvAirActionButtonState.processingText;
      const applied=applyReservationActionItem(data.reservation);
      if(!applied) await reloadReservationRowsOnly(true);
      scheduleNextPoll(true);
      showToast(`「${ev.title || '番組'}」を予約しました。`);
    }else{
      btn.disabled = false;
      btn.textContent = original || '予約';
      showToast(data.message || '予約に失敗しました。');
    }
  }catch(_){
    btn.disabled = false;
    btn.textContent = original || '予約';
    showToast('通信エラー');
  }
}

function applyReservationActionItem(item){
  if(!item || !Number.isFinite(Number(item.id))) return false;
  invalidateReservationSnapshotPublication();
  const id=Number(item.id);
  const index=allData.findIndex(x=>Number(x.id)===id);
  const nextData=allData.slice();
  if(index>=0) nextData[index]=item; else nextData.push(item);
  publishCanonicalReservationSnapshot(nextData);
  reconcileReservationActionStates(allData);
  lastReservationSignature=stableSignature(allData);
  idleTick=0;
  render();
  updateReservationColumnWidthVars();
  return true;
}

async function toggleEnabled(id, newVal, btn){
  const action=newVal ? 'enable' : 'disable';
  const state=beginReservationActionState(id,action);
  if(!state) return;
  btn.disabled = true;
  btn.textContent = state.text;
  try{
    const res = await fetch(`/api/reservations/${id}/enabled`, {
      method: 'PATCH',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ isEnabled: newVal })
    });
    const d = await readJsonSafely(res, {});
    if(res.ok){
      acceptReservationActionState(id);
      const applied=applyReservationActionItem(d.reservation);
      if(!applied) await reloadReservationRowsOnly(true);
      scheduleNextPoll(true);
    } else {
      clearReservationActionState(id);
      showToast(d.message || '更新に失敗しました。');
      render();
    }
  } catch(e){
    clearReservationActionState(id);
    showToast('通信エラー');
    render();
  }
}

async function stopRec(id, btn){
  const state=beginReservationActionState(id,'stop');
  if(!state) return;
  btn.disabled = true;
  btn.textContent = state.text;
  try{
    const res = await fetch(`/api/reservations/${id}/stop`, { method: 'POST' });
    const d = await readJsonSafely(res, {});
    if(res.ok){
      acceptReservationActionState(id);
      await reloadReservationRowsOnly(true);
      scheduleNextPoll(true);
    }else{
      clearReservationActionState(id);
      showToast(d.message || '停止に失敗しました。');
      btn.disabled = false;
      btn.textContent = '録画停止';
    }
  } catch(e){
    clearReservationActionState(id);
    showToast('通信エラー');
    btn.disabled = false;
    btn.textContent = '録画停止';
  }
}



async function copyUserEventReport(btn){
  const original = btn ? btn.textContent : '';
  if(btn){ btn.disabled = true; btn.textContent = window.TvAirActionButtonState.processingText; }
  try{
    const res = await fetch('/api/user-events/report?hours=24&count=200', { cache:'no-store' });
    const text = await res.text();
    if(!res.ok || !text){ showToast('報告用ログの作成に失敗しました。'); return; }
    if(navigator.clipboard && navigator.clipboard.writeText){
      await navigator.clipboard.writeText(text);
      showToast('直近24時間の報告用ログをコピーしました。');
    }else{
      window.prompt('報告用ログをコピーしてください', text);
    }
  }catch(_){
    showToast('通信エラー');
  }finally{
    if(btn){ btn.disabled = false; btn.textContent = original || '報告用コピー'; }
  }
}

async function clearLogReservations(btn){
  if(btn) { btn.disabled = true; btn.textContent = window.TvAirActionButtonState.processingText; }
  try{
    const res = await fetch("/api/user-events", { method: "DELETE" });
    const d = await res.json().catch(()=>({}));
    if(res.ok){ await load(); scheduleNextPoll(true); showToast(d.message || "ユーザー向けログを削除しました。"); }
    else{ showToast(d.message || "ログ削除に失敗しました。"); }
  }catch(e){ showToast("通信エラー"); }
  finally{ if(btn){ btn.disabled = false; btn.textContent = "一括削除"; } }
}

async function cancelReservation(id, btn){
  const state=beginReservationActionState(id,'cancel');
  if(!state) return;
  btn.disabled = true; btn.textContent = state.text;
  try{
    const res = await fetch(`/api/reservations/${id}`, { method: 'DELETE' });
    const d = await readJsonSafely(res, {});
    if(res.ok){
      acceptReservationActionState(id);
      // RESERVATION_CANCEL_PROJECTION_SINGLE_SOURCE:
      // DELETE commits Scheduled/Starting -> Cancelled in ReservationStore. Do not remove the row
      // locally from allData from affected ids; publish only the canonical server snapshot so the
      // Cancelled status/history projection remains visible and cannot be overwritten by client state.
      await reloadReservationRowsOnly(true);
      scheduleNextPoll(true);
    }else{
      clearReservationActionState(id);
      showToast(d.message || '予約取消に失敗しました。');
      render();
    }
  } catch(e){
    clearReservationActionState(id);
    showToast('通信エラー');
    render();
  }
}

function applyConflictJumpHint(){
  try{
    const raw = sessionStorage.getItem("tvair_conflict_target");
    if(!raw) return;
    sessionStorage.removeItem("tvair_conflict_target");
    const target = JSON.parse(raw);
    // Conflict notice text stays removed; keep only explicit row focus/highlight.
    setTimeout(()=>{
      const row = document.querySelector(`[data-reservation-id="${target.id}"]`) || document.querySelector('tr.conflicted');
      if(row){
        row.scrollIntoView({behavior:'smooth', block:'center'});
        row.classList.add('flash-conflict');
        setTimeout(()=>row.classList.remove('flash-conflict'), 2500);
      }
    }, 120);
  }catch(_){ }
}


let pollTimer = null;
let idleTick = 0;
let lastReservationSignature = "";
function stableSignature(value){ try{ return JSON.stringify(value); }catch(_){ return String(Date.now()); } }
function hasPendingRecordingStopAction(){
  for(const state of reservationActionStates.values()){
    if(state && state.action==='stop') return true;
  }
  return false;
}

function hasRealtimeReservation(rows){
  const now = Date.now();
  return (rows || []).some(r => {
    const st = String((r && r.status) || '').toLowerCase();
    if(st === 'recording' || st === 'stopping') return true;
    if(st === 'scheduled'){
      const start = new Date(r.startTime || r.start || 0).getTime();
      const end = new Date(r.endTime || r.end || 0).getTime();
      return Number.isFinite(start) && Number.isFinite(end) && start - 120000 <= now && now <= end + 300000;
    }
    return false;
  });
}

function scheduleNextPoll(reset=false){
  if(reset) idleTick = 0;
  clearTimeout(pollTimer);
  if(document.hidden) return;
  const pendingStop = hasPendingRecordingStopAction();
  const realtime = hasRealtimeReservation(allData);
  // A manual recording stop follows the canonical reservation snapshot without a
  // fixed success timeout.  Poll more closely only while that explicit operation is
  // pending; normal recording/background cadence remains unchanged.
  const ms = pendingStop ? 500 : (realtime ? 5000 : (idleTick >= 30 ? 300000 : idleTick >= 10 ? 120000 : 60000));
  pollTimer = setTimeout(async () => {
    if(document.hidden){ scheduleNextPoll(false); return; }
    idleTick++;
    await load(false);
    scheduleNextPoll(false);
  }, ms);
}

window.addEventListener('focus', async () => { if(!document.hidden){ await load(false); scheduleNextPoll(true); } });
document.addEventListener('visibilitychange', async () => {
  if(document.visibilityState === 'visible'){
    await load(false);
    scheduleNextPoll(true);
  } else {
    clearTimeout(pollTimer);
  }
});

let reservationRailObserver = null;
function ensureReservationRailObserver(){
  if(reservationRailObserver || typeof ResizeObserver === 'undefined') return;
  const main = document.getElementById('main');
  if(!main) return;
  reservationRailObserver = new ResizeObserver(() => updateReservationScrollLayout());
  reservationRailObserver.observe(main);
}

window.addEventListener('resize', updateReservationScrollLayout);
window.addEventListener('load', () => { ensureReservationRailObserver(); updateReservationScrollLayout(); });

persistReservationFilterLocation(currentFilter);
updateFilterTabActive();
applyReservationListRole();
updateGenreColorButton();
load(true).then(() => { applyConflictJumpHint(); updateFilterTabActive(); applyReservationListRole(); updateGenreColorButton(); updateReservationScrollLayout(); scheduleNextPoll(true); });

document.addEventListener('DOMContentLoaded', ()=>{
  updateFilterTabActive();
  applyReservationListRole();
  updateLogActionHost();
  ensureReservationRailObserver();
  updateReservationScrollLayout();
});
